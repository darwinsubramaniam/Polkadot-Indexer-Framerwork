# Multi-chain indexer configuration.
#
# This file is the whole story for "which chains do we index". Adding a chain means
# adding a block here — no code change, no recompile. Everything else about a chain
# (its name, SS58 prefix, token symbol/decimals, genesis hash) is discovered from the
# node on first connect and recorded in the `chains` table.
#
# Each chain names a source — how the indexer reaches it:
#
#   [chains.source]
#   type = "rpc"                       # somebody's node, over WebSocket
#   url  = "wss://…"
#
#   [chains.source]                    # or several nodes for the same chain
#   type = "rpc"
#   endpoints = [
#       { url = "wss://rpc-a.example", archive = true,  max_rps = 20 },
#       { url = "wss://rpc-b.example", archive = false, max_rps = 5 },
#       { url = "wss://rpc-c.example" },     # capabilities probed at connect
#   ]
#
# Endpoints are NOT interchangeable, which is why each is a table rather than a bare URL.
# One may keep archived state and another prune it; one may tolerate twenty calls a second
# where another bans you at five. Backfill is spread across all of them through a queue of
# leases, each paced by its own rate limiter, so losing one costs throughput and never
# correctness. `archive` and `max_rps` are both optional -- omit them and the indexer probes
# the node and converges on its limit by backing off whenever it is refused.
#
#   [chains.source]
#   type = "light-client"              # smoldot, in-process, trusts nobody
#   chain_spec = "specs/polkadot.json"
#
# `ws_url = "…"` at the top level is still accepted as shorthand for an rpc source.
#
# The two are not interchangeable. An rpc source can fetch any block by number, so it can
# backfill history (from an archive node) and is the only way to index the past. A light
# client verifies headers against the chain's own finality proofs and so trusts no node
# operator — but it cannot map a block *number* to a hash (there is no way to verify such an
# answer), so it only ever follows the finalized head forward from the moment it starts.
# Requires building with `--features light-client`.

# --------------------------------------------------------------------------------------
# The block archive
# --------------------------------------------------------------------------------------
#
# Fetching and processing are two separate stages, with raw blocks on local disk between
# them. That is what makes a re-index cost a re-*digest* rather than a re-download: adding a
# handler, or fixing a decode bug, becomes `pif replay` over bytes already held.
#
# The archive holds two things, because a block archive is not a state archive. Handlers do
# not read only blocks: `pallet_identity` emits `IdentitySet { who }` with no display name, so
# the event says which key changed and only storage says what it changed to. Those storage
# answers are archived alongside the blocks, keyed by the block they were read at, so a
# replay needs no node either.
#
# Optional. Without this table every chain archives to `.pif-store` next to the config file,
# which is what the defaults below say. A chain can override it with its own
# `[chains.pipeline]` table.
#
# Sizing, so a disk can be bought before it is needed: Polkadot is ~28M blocks at roughly
# 5-15 KB raw per block with events, so 200-400 GB uncompressed and 60-120 GB with zstd. The
# storage read cache for a state-heavy handler such as `identity` can exceed the blocks
# themselves; budget for it separately.
#
# [pipeline]
# hot_path = "/mnt/ssd/pif"
# # Blocks per segment file. Segments are aligned, so a block's file is computed from its
# # number rather than looked up -- which means changing this on an existing store makes
# # everything already written unfindable. Choose it once.
# segment_size = 1000
# # Blocks per lease in the fetch work queue: the unit of parallelism and of retry. A chunk
# # is claimed by one endpoint, archived, and marked done as a whole. Smaller chunks spread
# # work more evenly and lose less to a failure; larger ones spend less time in Postgres.
# chunk_size = 128
# # How far the fetch stage may run ahead of the digest, in blocks.
# #
# # Not a throughput knob. The storage read cache is filled on the FIRST digest of a block,
# # from a node -- so a fetcher 100k blocks ahead means every one of those reads asks for
# # state the node discarded long ago. Substrate defaults to `--state-pruning 256`.
# #
# # Omit to decide from the endpoint: an archive node gets no brake, anything else gets 256.
# # Set it to bound how far the archive can grow ahead of Postgres regardless.
# max_digest_lag = 100000
# # Blocks per digest transaction. A block that decodes in microseconds otherwise costs a
# # fixed handful of round-trips to Postgres, and that is what the digest spends its time on.
# #
# # It does not weaken atomicity: the cursor and the watermark still commit WITH the rows they
# # describe, for a batch instead of a block, and a partial batch rolls back whole. What it
# # widens is what a handler failure re-does -- so `1` is a legitimate setting for a handler
# # that is expensive to redo, and restores the old one-transaction-per-block behaviour.
# digest_batch = 32

[[chains]]
# Stable key. Becomes the primary key in every table, so don't rename it casually.
id = "dev-local"
ws_url = "ws://127.0.0.1:9944"
# Block to start from when there is no stored cursor. 0 = genesis.
start_block = 0
# Typed-overlay handlers to run for this chain, by name. Empty = dynamic decoding only,
# which is what makes the indexer work against an arbitrary Substrate chain.
# A handler only activates if its compiled metadata matches this chain (see `supports()`).
handlers = []

# Example of a second chain indexed by the same process, with a typed projection enabled.
# Requires building with `--features handler-balances`.
#
# [[chains]]
# id = "para-1000"
# start_block = 0
# handlers = ["balances-transfer"]
#
# [chains.source]
# type = "rpc"
# url = "ws://127.0.0.1:9988"

# The Polkadot People chain: identities, registrar judgements, sub-identities and usernames.
# Requires building with `--features handler-identity`.
#
# NOTE: the handler reads chain *state*, not just events, because `pallet_identity`'s events
# carry no payload (`IdentitySet { who }` has no display name). Storage reads at a historical
# block need an ARCHIVE node -- the public endpoint below keeps only recent state, so set
# `start_block` near the finalized head unless you have an archive endpoint. On first run the
# handler sweeps `IdentityOf` once to seed everything that existed before `start_block`.
#
# [[chains]]
# id = "polkadot-people"
# ws_url = "wss://polkadot-people-rpc.polkadot.io"
# start_block = 0
# handlers = ["identity"]

# The same People chain, followed by a light client instead — no node operator to trust, and
# no endpoint to be rate-limited by. `just fetch-chain-specs` downloads the specs.
#
# A parachain's finality is its relay chain's finality, so a light client has to sync the
# relay too: name it with `relay_chain_spec`. Every chain here naming the same relay spec
# shares one relay-chain sync, so indexing five parachains of Polkadot costs one.
#
# Indexing starts at the current finalized head — `start_block` is rejected for a light
# client rather than silently ignored — so the identity handler's opening sweep of
# `IdentityOf` is what gives you the pre-existing identities.
#
# [[chains]]
# id = "polkadot-people-lc"
# handlers = ["identity"]
#
# [chains.source]
# type = "light-client"
# chain_spec = "specs/polkadot-people.json"
# relay_chain_spec = "specs/polkadot.json"
# # bootnodes = ["/ip4/…/tcp/30333/p2p/12D3Koo…"]   # override the spec's, e.g. for a local net
