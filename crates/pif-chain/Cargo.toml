[package]
name = "polkadot-indexer-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chain ingest, dynamic SCALE decoding and the handler extension point for the Polkadot Indexer Framework"
repository = "https://github.com/darwinsubramaniam/polkadot-indexer-framework"
homepage = "https://github.com/darwinsubramaniam/polkadot-indexer-framework"
readme = "../../README.md"
keywords = ["polkadot", "substrate", "indexer", "blockchain", "subxt"]
categories = ["database", "command-line-utilities"]

[features]
default = []

# In-process smoldot light client, selectable per chain via `[chains.source]`. Off by
# default: smoldot is a large dependency (it is a whole Substrate client), and a deployment
# pointing at its own node never needs it.
light-client = ["subxt/light-client"]

[lib]
# Short import name: `use pif_chain::…`. The published package name is longer for
# discoverability on crates.io; Cargo allows the two to differ.
name = "pif_chain"

[dependencies]
pif-core.workspace = true
pif-db.workspace = true

subxt.workspace = true
scale-value.workspace = true
parity-scale-codec.workspace = true

sqlx.workspace = true
bigdecimal.workspace = true
chrono.workspace = true

tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
hex.workspace = true
tracing.workspace = true
