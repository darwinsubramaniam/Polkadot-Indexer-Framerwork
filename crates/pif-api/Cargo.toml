[package]
name = "polkadot-indexer-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extensible GraphQL API for the Polkadot Indexer Framework"
repository = "https://github.com/darwinsubramaniam/polkadot-indexer-framework"
homepage = "https://github.com/darwinsubramaniam/polkadot-indexer-framework"
readme = "../../README.md"
keywords = ["polkadot", "substrate", "indexer", "blockchain", "subxt"]
categories = ["database", "command-line-utilities"]

[lib]
# Short import name: `use pif_api::…`. The published package name is longer for
# discoverability on crates.io; Cargo allows the two to differ.
name = "pif_api"

[dependencies]
pif-core.workspace = true
pif-db.workspace = true

async-graphql.workspace = true
async-graphql-axum.workspace = true
axum.workspace = true
tower-http.workspace = true

sqlx.workspace = true
bigdecimal.workspace = true
chrono.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true
tracing.workspace = true
